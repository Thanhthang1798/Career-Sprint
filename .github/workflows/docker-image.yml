name: Deploy Career Sprint

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/Thanhthang1798/career-sprint:${{ github.sha }} \
            -t ghcr.io/Thanhthang1798/career-sprint:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/Thanhthang1798/career-sprint:${{ github.sha }}
          docker push ghcr.io/Thanhthang1798/career-sprint:latest


  deploy:
    name: Deploy to VPS
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/career-sprint

            echo "Pulling latest image..."
            docker pull ghcr.io/Thanhthang1798/career-sprint:latest

            echo "Restarting application..."
            docker compose up -d

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Deployment completed."

            docker ps
